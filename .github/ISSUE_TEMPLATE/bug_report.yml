name: Bug report
description: Report a reproducible AirCiller problem without attaching private data.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not publish credentials, pairing codes, personal paths, IP addresses, Apple TV names, movies, or commercial subtitles.
  - type: input
    id: version
    attributes:
      label: AirCiller, macOS, and tvOS versions
      placeholder: AirCiller 0.9.7, macOS 27.x, tvOS 27.x
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use generic names for files and receivers.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual results
    validations:
      required: true
  - type: dropdown
    id: route
    attributes:
      label: Affected path
      options:
        - Direct HDR/Dolby Vision MP4
        - HLS/fMP4 without subtitles
        - HLS/fMP4 with subtitles
        - Interface, playlist, or controls
        - I do not know
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed paths, IP addresses, device names, credentials, and protected content.
          required: true

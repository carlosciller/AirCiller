name: Informe de error
description: Explica un fallo reproducible de AirCiller sin adjuntar datos privados.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        No publiques credenciales, códigos, rutas personales, IP, nombre del Apple TV, películas ni subtítulos comerciales.
  - type: input
    id: version
    attributes:
      label: Versión de AirCiller, macOS y tvOS
      placeholder: AirCiller 0.9.7, macOS 27.x, tvOS 27.x
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      description: Usa nombres genéricos para los archivos y receptores.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado y resultado real
    validations:
      required: true
  - type: dropdown
    id: route
    attributes:
      label: Ruta afectada
      options:
        - MP4 directo HDR/Dolby Vision
        - HLS/fMP4 sin subtítulos
        - HLS/fMP4 con subtítulos
        - Interfaz, playlist o control
        - No lo sé
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidad
      options:
        - label: He eliminado rutas, IP, nombres de dispositivos, credenciales y contenido protegido.
          required: true

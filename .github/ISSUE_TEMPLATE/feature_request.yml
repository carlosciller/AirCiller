name: Feature idea
description: Suggest one focused improvement to AirCiller.
title: "[Idea]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        AirCiller keeps media local, preserves originals and asks before audio conversion. Focused ideas are welcome. The separately configured private-control integration is optional; ordinary playback needs no permanent service.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Start with the viewing situation, not the implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would feel natural on macOS?
      description: Describe the interaction you would expect on macOS.
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Trade-offs or alternatives
      description: Optional. Mention anything that could affect quality, privacy, performance, or Apple TV compatibility.
  - type: checkboxes
    id: fit
    attributes:
      label: Project fit
      options:
        - label: This does not require uploading media, telemetry, or silent transcoding.
          required: true

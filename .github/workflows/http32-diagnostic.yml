name: HTTP32 diagnostic
on:
  push:
    branches: [fix/http-terminal-cleanup]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: macos-26
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - name: Compile only the unchanged HTTP server and diagnostic test
        run: |
          mkdir -p .build
          xcrun swiftc -sdk "$(xcrun --sdk macosx --show-sdk-path)" \
            -target arm64-apple-macosx14.0 -parse-as-library -swift-version 6 \
            -strict-concurrency=complete -warnings-as-errors -framework Network -D AIRCILLER_HTTP_TESTS \
            Sources/Localization.swift Sources/HTTPServerTelemetry.swift \
            Sources/LocalNetworkRoute.swift Sources/NetworkAddressIdentity.swift \
            Sources/LocalHTTPServer.swift Tests/HTTPServerSmokeTest.swift \
            -o .build/http32
      - name: Four independent reproductions under bounded CPU contention
        run: |
          pids=()
          for run in {1..4}; do
            .build/http32 > ".build/http32-$run.log" 2>&1 &
            pids+=("$!")
          done
          result=0
          for pid in "${pids[@]}"; do
            wait "$pid" || result=1
          done
          cat .build/http32-*.log
          exit "$result"

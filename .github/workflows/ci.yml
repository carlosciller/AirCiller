name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: xcode-27
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Prepare locked AirPlay dependencies
        run: AIRCILLER_PYTHON="$(command -v python3)" ./Scripts/bootstrap_dependencies.sh

      - name: Build and test
        run: ./Scripts/check.sh
